<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeVa design — vođenje poslova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2EFE9;
    --surface:#FFFFFF;
    --surface-alt:#F8F6F1;
    --border:#DDD6C7;
    --ink:#2A2420;
    --ink-muted:#8A8071;
    --primary:#2F5D62;
    --primary-dark:#1F4347;
    --primary-light:#E4EDEC;
    --amber:#C1793B;
    --amber-light:#F6E8D8;
    --green:#4C7A5A;
    --green-light:#E4EFE7;
    --rust:#B5533C;
    --rust-light:#F5E2DD;
    --radius:10px;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
  #app{max-width:900px;margin:0 auto;padding-bottom:60px;}

  /* Header */
  .header{background:var(--primary-dark);color:#fff;padding:22px 18px 16px;}
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand-mark{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:0.02em;}
  .brand-sub{font-size:12px;color:#B9CBCB;font-weight:500;}
  .ruler{margin-top:14px;height:10px;position:relative;border-top:1px solid rgba(255,255,255,0.35);}
  .ruler::before{content:"";position:absolute;top:0;left:0;right:0;height:10px;background-image:repeating-linear-gradient(90deg, rgba(255,255,255,0.35) 0, rgba(255,255,255,0.35) 1px, transparent 1px, transparent 14px);}

  /* Nav */
  .nav{display:flex;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;}
  .nav button{flex:1;padding:13px 6px;background:none;border:none;font-family:var(--font-body);font-weight:600;font-size:13.5px;color:var(--ink-muted);cursor:pointer;border-bottom:3px solid transparent;}
  .nav button.active{color:var(--primary-dark);border-bottom-color:var(--amber);}

  .content{padding:16px;}

  /* Buttons */
  button{font-family:var(--font-body);}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-weight:600;font-size:13.5px;cursor:pointer;}
  .btn:hover{background:var(--surface-alt);}
  .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-ghost{border-color:transparent;background:none;color:var(--primary-dark);padding:6px 8px;}
  .btn-danger{color:var(--rust);border-color:var(--rust-light);background:var(--rust-light);}
  .btn-sm{padding:6px 10px;font-size:12.5px;}
  .btn-block{width:100%;justify-content:center;}

  /* Cards */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
  .cust-card{display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .cust-card:hover{border-color:var(--primary);}
  .cust-name{font-family:var(--font-display);font-weight:700;font-size:16px;}
  .cust-meta{font-size:12px;color:var(--ink-muted);margin-top:2px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
  .chip{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;}
  .chip-on{background:var(--green-light);color:var(--green);}
  .chip-off{background:var(--surface-alt);color:var(--ink-muted);border:1px solid var(--border);}
  .chip-mid{background:var(--amber-light);color:var(--amber);}

  .empty{text-align:center;padding:50px 20px;color:var(--ink-muted);}
  .empty-title{font-family:var(--font-display);font-weight:700;color:var(--ink);font-size:17px;margin-bottom:6px;}

  /* Add customer bar */
  .add-bar{display:flex;gap:8px;margin-bottom:16px;align-items:stretch;}
  .add-bar input{flex:1;}
  .add-bar .field-mic-row{flex:1;}

  /* Form elements */
  label{display:block;font-size:12px;font-weight:600;color:var(--ink-muted);margin-bottom:4px;margin-top:12px;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=number],input[type=date],select{
    width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:7px;font-size:14px;font-family:var(--font-body);background:#fff;color:var(--ink);
  }
  input:focus,select:focus{outline:2px solid var(--primary);outline-offset:1px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .checkline{display:flex;align-items:center;gap:8px;margin-top:12px;cursor:pointer;user-select:none;}
  .checkline input{width:17px;height:17px;accent-color:var(--primary);}
  .checkline span{font-size:13.5px;font-weight:600;}
  input.hl{background:var(--green-light);font-weight:700;}

  /* Detail header */
  .detail-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
  .back{color:var(--primary-dark);font-weight:600;font-size:13px;background:none;border:none;cursor:pointer;padding:4px 0 12px;}
  .detail-name-input{font-family:var(--font-display);font-weight:700;font-size:20px;border:none;background:none;padding:0;width:100%;color:var(--ink);}
  .detail-name-input:focus{outline:none;border-bottom:2px solid var(--amber);}

  /* Segments */
  details.segment{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
  details.segment[open]{border-color:var(--primary);}
  summary.seg-head{list-style:none;cursor:pointer;padding:14px;display:flex;align-items:center;gap:12px;background:var(--surface-alt);}
  summary.seg-head::-webkit-details-marker{display:none;}
  .seg-num{font-family:var(--font-display);font-weight:700;font-size:12px;color:#fff;background:var(--primary);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .seg-title{font-family:var(--font-display);font-weight:700;font-size:15px;flex:1;}
  .seg-status{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;}
  .seg-body{padding:14px;border-top:1px solid var(--border);}
  .sub-head{font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--primary-dark);margin:18px 0 8px;padding-top:12px;border-top:1px dashed var(--border);}
  .sub-head:first-of-type{border-top:none;padding-top:0;margin-top:6px;}

  /* Ponuda boxes (po skici) */
  .box-title{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--primary-dark);margin:0 0 10px;}
  .box-sub{font-family:var(--font-display);font-weight:700;font-size:13px;margin:16px 0 8px;padding-top:12px;border-top:1px dashed var(--border);}

  /* multi-firm rows */
  .firm-row{background:var(--surface-alt);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;}
  .firm-row-top{display:flex;gap:8px;align-items:flex-start;}
  .firm-row-top .grow{flex:1;}
  .rm-btn{background:var(--rust-light);color:var(--rust);border:none;border-radius:6px;width:30px;height:30px;flex-shrink:0;cursor:pointer;font-size:15px;margin-top:20px;}
  .file-btn-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .file-btn-row input[type=file]{font-size:12px;}
  .file-thumb{width:34px;height:34px;object-fit:cover;border-radius:5px;border:1px solid var(--border);}
  .file-name{font-size:11.5px;color:var(--ink-muted);word-break:break-all;}

  .summary-box{background:var(--primary-light);border:1px solid var(--primary);border-radius:8px;padding:12px;margin-top:14px;}
  .summary-box.green{background:var(--green-light);border-color:var(--green);}
  .sum-line{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:3px 0;}
  .sum-line b{font-family:var(--font-display);white-space:nowrap;}
  .sum-total{border-top:1px solid var(--primary);margin-top:6px;padding-top:8px;font-weight:700;}
  .summary-box.green .sum-total{border-top-color:var(--green);}

  /* Pregled */
  .pregled-card .chip-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;}

  /* Reports */
  .rep-item{margin-bottom:10px;}
  .rep-label{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:4px;}
  .rep-bar-bg{background:var(--surface-alt);border-radius:6px;height:10px;overflow:hidden;}
  .rep-bar{background:var(--primary);height:100%;border-radius:6px;}
  .rep-bar.amber{background:var(--amber);}

  h2.section-title{font-family:var(--font-display);font-size:17px;margin:4px 0 14px;}
  .note{font-size:12px;color:var(--ink-muted);margin-top:6px;}
  select{appearance:auto;}

  /* Voice input */
  .field-mic-row{display:flex;gap:6px;align-items:stretch;}
  .field-mic-row input{flex:1;min-width:0;}
  .mic-btn{flex-shrink:0;width:38px;border-radius:7px;border:1px solid var(--border);background:var(--surface-alt);font-size:15px;cursor:pointer;}
  .mic-btn.listening{background:var(--rust);border-color:var(--rust);color:#fff;animation:pulse 1s infinite;}
  @keyframes pulse{0%{opacity:1;}50%{opacity:0.55;}100%{opacity:1;}}

  /* Calendar reminder */
  .date-row{display:flex;gap:6px;align-items:stretch;}
  .date-row input{flex:1;min-width:0;}
  .cal-btn{flex-shrink:0;width:38px;border-radius:7px;border:1px solid var(--primary);background:var(--primary-light);font-size:15px;cursor:pointer;color:var(--primary-dark);}

  /* Stats */
  .stat-card{background:var(--primary-dark);color:#fff;border-radius:var(--radius);padding:16px;margin-bottom:16px;}
  .stat-label{font-size:12px;color:#B9CBCB;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;}
  .stat-value{font-family:var(--font-display);font-weight:700;font-size:26px;margin-top:4px;}
  .stat-card.amber{background:var(--amber);}
  .stat-card.amber .stat-label{color:#FBEBD9;}

  /* Poslovi (jobs) */
  details.segment.posao-segment{border-color:var(--amber);}
  details.segment.posao-segment>summary.seg-head.posao-head{background:var(--amber-light);}
  .posao-title-input{font-family:var(--font-display);font-weight:700;font-size:15px;border:none;background:none;flex:1;min-width:0;color:var(--ink);padding:0;}
  .posao-title-input:focus{outline:none;border-bottom:2px solid var(--amber);}

  .rm-btn-inline{background:var(--rust-light);color:var(--rust);border:none;border-radius:6px;width:26px;height:26px;flex-shrink:0;cursor:pointer;font-size:13px;}
  input:disabled{background:var(--surface-alt);color:var(--ink-muted);}
  .seg-head-row{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px;}

  /* Auth / sync UI */
  .auth-wrap{max-width:340px;margin:60px auto;padding:24px;}
  .auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;}
  .auth-title{font-family:var(--font-display);font-weight:700;font-size:19px;margin-bottom:14px;}
  .auth-error{color:var(--rust);font-size:12.5px;margin-top:8px;min-height:16px;}
  .auth-switch{margin-top:14px;font-size:13px;text-align:center;}
  .auth-switch a{color:var(--primary-dark);font-weight:600;cursor:pointer;text-decoration:underline;}
  .sync-status{font-size:11px;color:#B9CBCB;display:flex;align-items:center;gap:6px;margin-top:8px;}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:#7AD08A;flex-shrink:0;}
  .sync-dot.busy{background:var(--amber);}
  .sync-dot.err{background:#E06B5A;}
  .logout-link{color:#B9CBCB;font-size:11px;cursor:pointer;text-decoration:underline;margin-left:auto;}
</style>
</head>
<body>
<!-- === FIREBASE (besplatan): omogućava pristup podacima sa svih uređaja === -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<div id="app"></div>

<script>
const EUR_KM = 1.95583;
let state = { customers: [], view: 'list', activeId: null, loaded: false, detailsState: {} };

/* ====================== FIREBASE PODEŠAVANJE ======================
   1) Idi na https://console.firebase.google.com i napravi besplatan projekat.
   2) U projektu: Build → Authentication → Sign-in method → uključi "Email/Password".
   3) U projektu: Build → Firestore Database → Create database (počni u "test mode",
      kasnije podesi pravila ispod).
   4) Project settings (zupčanik) → General → "Your apps" → dodaj Web app (</> ikona)
      → kopiraj firebaseConfig objekat i zalijepi ga OVDJE umjesto reda ispod.
   5) U Firestore → Rules, zalijepi:
      rules_version = '2';
      service cloud.firestore {
        match /databases/{database}/documents {
          match /users/{userId}/customers/{customerId} {
            allow read, write: if request.auth != null && request.auth.uid == userId;
          }
        }
      }
===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyAGQOmDYg_DJLLQMZwHFjh3nZ5dYsRTMzQ",
  authDomain: "neva-design-123.firebaseapp.com",
  projectId: "neva-design-123",
  storageBucket: "neva-design-123.firebasestorage.app",
  messagingSenderId: "1067156557306",
  appId: "1:1067156557306:web:b1a22ef3c93c1d54032843"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
let currentUser = null;
let saveTimer = null;
let authView = 'login'; // 'login' | 'signup'
let authError = '';

/* ---------- utils ---------- */
function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function money(n){ return n.toLocaleString('sr-Latn-BA',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function toKM(iznos, valuta){ return valuta==='EUR' ? num(iznos)*EUR_KM : num(iznos); }
function sumArr(arr, field){ return (arr||[]).reduce((s,x)=>s+num(x[field]),0); }

/* ---------- open/closed <details> state (kept across re-renders in this session) ---------- */
function onSegToggle(key, el){ state.detailsState[key] = el.open; }
function openAttr(key, def){ const v = (key in state.detailsState) ? state.detailsState[key] : def; return v ? 'open' : ''; }

/* ---------- data model ---------- */
/* Ponuda (jedna po poslu), strukturirana prema skici:
   firme            — ponude iz firmi za rezanje materijala {firma, iznos, datum, prihvacena}
   ostaliZaPonudu   — ostali troškovi za ponudu {naziv, iznos}
   konacniIznos/konacniDatum — konačni iznos ponude prema kupcu
   avansIznos/avansDatum     — avans uzet od kupca
   materijal        — troškovi: materijal {firma, iznos, fajl(predračun)}
   dizajnTrosak     — troškovi: dizajn
   ostaliTroskovi   — troškovi: ostali {naziv, iznos, firma, datum}                    */
function newPonuda(){
  return {
    firme: [], ostaliZaPonudu: [],
    konacniIznos: '', konacniDatum: '',
    avansIznos: '', avansDatum: '',
    materijal: [], dizajnTrosak: '', ostaliTroskovi: []
  };
}
function newPosao(naziv){
  return {
    id: uid(),
    naziv: naziv || 'Posao',
    okvirniDatumIzrade:'', rokDizajn:'', dizajnPredat:false, dizajnPotvrdjen:false, dizajnFajl:null,
    ponuda: newPonuda(),
    izrada: { status:'nije_pocelo', naplata:{ naplaceno:false, iznos:'', valuta:'KM', datum:'' } }
  };
}
function newCustomer(naziv){
  return {
    id: uid(),
    naziv: naziv || 'Novi kupac',
    kontakt: '',
    napomene: [],
    poslovi: [ newPosao('Posao 1') ]
  };
}

function getCustomer(id){ return state.customers.find(c=>c.id===id); }
function getPosao(cid,pid){ const c=getCustomer(cid); return c && c.poslovi.find(p=>p.id===pid); }

/* ---------- computed ---------- */
const JE_PREVOZ = /(pre|prije)voz/i;   // "prevoz" / "prijevoz" u nazivu troška
function prihvacenoFirmi(o){ return (o.firme||[]).filter(r=>r.prihvacena).reduce((s,r)=>s+num(r.iznos),0); }
function procjenaTroskaPonude(o){ return prihvacenoFirmi(o) + sumArr(o.ostaliZaPonudu,'iznos'); }
function materijalUkupno(o){ return sumArr(o.materijal,'iznos'); }
function ostaliUkupno(o){ return sumArr(o.ostaliTroskovi,'iznos'); }
function ukupniTroskovi(o){ return materijalUkupno(o) + ostaliUkupno(o); }
function preostaloOdKupca(o){ return num(o.konacniIznos) - num(o.avansIznos); }
// Zarada = konačni iznos − (materijal + ostali troškovi) − dizajn.
// Vaso = Zarada/2 ; Nešo = Zarada/2 + trošak dizajna.
function podjelaPosla(p){
  const o = p.ponuda;
  const dizajn = num(o.dizajnTrosak);
  const zarada = num(o.konacniIznos) - ukupniTroskovi(o) - dizajn;
  return { zarada, vaso: zarada/2, neso: zarada/2 + dizajn };
}
function ukupanPrihod(){
  let s = 0;
  state.customers.forEach(c=> (c.poslovi||[]).forEach(p=>{
    if(p.izrada.naplata.naplaceno) s += toKM(p.izrada.naplata.iznos, p.izrada.naplata.valuta);
  }));
  return s;
}
function ukupnoPoOsobi(){
  let neso = 0, vaso = 0;
  state.customers.forEach(c=> (c.poslovi||[]).forEach(p=>{
    if(p.izrada.naplata.naplaceno){
      const d = podjelaPosla(p);
      neso += d.neso; vaso += d.vaso;
    }
  }));
  return {neso, vaso};
}
const MJESECI_NAZIVI = ['Januar','Februar','Mart','April','Maj','Juni','Juli','Avgust','Septembar','Oktobar','Novembar','Decembar'];
function mjesecNaziv(ym){
  const parts = ym.split('-');
  const naziv = MJESECI_NAZIVI[parseInt(parts[1],10)-1];
  return naziv + ' ' + parts[0];
}
function prihodPoMjesecima(){
  const map = {};
  state.customers.forEach(c=> (c.poslovi||[]).forEach(p=>{
    if(p.izrada.naplata.naplaceno){
      const datum = p.izrada.naplata.datum;
      const key = datum ? datum.slice(0,7) : '(bez datuma)';
      if(!map[key]) map[key] = {ukupno:0, neso:0, vaso:0};
      const d = podjelaPosla(p);
      map[key].ukupno += toKM(p.izrada.naplata.iznos, p.izrada.naplata.valuta);
      map[key].neso += d.neso;
      map[key].vaso += d.vaso;
    }
  }));
  return map;
}
function ponudaPotvrdjena(p){ return (p.ponuda.firme||[]).some(r=>r.prihvacena); }
function ponudaPoslata(p){ return num(p.ponuda.konacniIznos) > 0; }
function posaoStatus(p){
  if(p.izrada.naplata.naplaceno) return {text:'Naplaćeno', cls:'chip-on'};
  if(p.izrada.status==='zavrseno') return {text:'Izrada završena', cls:'chip-mid'};
  if(p.izrada.status==='u_izradi') return {text:'U izradi / montaži', cls:'chip-mid'};
  if(ponudaPotvrdjena(p)) return {text:'Ponuda potvrđena', cls:'chip-mid'};
  if(ponudaPoslata(p)) return {text:'Ponuda poslata', cls:'chip-mid'};
  return {text:'U pripremi', cls:'chip-off'};
}

/* ---------- persistence / migration ---------- */
// Prebacuje posao sa starog modela (više ponuda + nabavka) na novi (jedna ponuda po skici).
// Stare ponude se čuvaju u p.arhivaPonuda (ne prikazuju se, ali se ništa ne gubi).
function migratePosao(p){
  if(!p.ponuda){
    const np = newPonuda();
    const olds = Array.isArray(p.ponude) ? p.ponude : [];
    const chosen = olds.find(o=>o.ponudaPotvrdjena) || olds[0];
    if(chosen){
      if(num(chosen.ponudaMaterijalIznos) || chosen.firma){
        np.firme.push({id:uid(), firma:chosen.firma||'', iznos:chosen.ponudaMaterijalIznos||'', datum:chosen.ponudaMaterijalDatum||'', prihvacena:!!chosen.ponudaPotvrdjena});
      }
      if(num(chosen.cijenaOkovaIznos)){
        np.ostaliZaPonudu.push({id:uid(), naziv:'Okov', iznos:chosen.cijenaOkovaIznos});
      }
      np.konacniIznos = chosen.dogovoreniIznos || chosen.ponudaIznos || '';
      np.konacniDatum = chosen.ponudaDatum || '';
      const av = (chosen.avansi||[]);
      const avSum = av.reduce((s,a)=>s+toKM(a.iznos,a.valuta),0);
      np.avansIznos = avSum ? String(Math.round(avSum*100)/100) : '';
      np.avansDatum = (av.find(a=>a.datum)||{}).datum || '';
    }
    const nab = p.nabavka || {};
    (nab.kroznaListe||[]).forEach(r=>np.materijal.push({id:uid(), firma:r.firma||'', iznos:r.iznos||'', fajl:r.fajl||null}));
    (nab.okoviKupljeni||[]).forEach(r=>np.ostaliTroskovi.push({id:uid(), naziv:'Okov', iznos:r.iznos||'', firma:r.firma||'', datum:''}));
    if(olds.length) p.arhivaPonuda = olds;
    p.ponuda = np;
    delete p.ponude; delete p.nabavka;
  }
  const o = p.ponuda;
  ['firme','ostaliZaPonudu','materijal','ostaliTroskovi'].forEach(k=>{ if(!Array.isArray(o[k])) o[k] = []; });
  ['konacniIznos','konacniDatum','avansIznos','avansDatum','dizajnTrosak'].forEach(k=>{ if(typeof o[k]==='undefined') o[k]=''; });
  if(!p.izrada) p.izrada = {status:'nije_pocelo', naplata:{naplaceno:false,iznos:'',valuta:'KM',datum:''}};
  if(!p.izrada.naplata) p.izrada.naplata = {naplaceno:false,iznos:'',valuta:'KM',datum:''};
  if(typeof p.dizajnFajl === 'undefined') p.dizajnFajl = null;
}
function migrateCustomer(c){
  if(!Array.isArray(c.napomene)) c.napomene = [];
  if(!Array.isArray(c.poslovi)){
    // najstariji format: jedan kupac = jedan posao
    const oldP = c.ponuda || {};
    const oldN = c.nabavka || {kroznaListe:[],okoviKupljeni:[]};
    const oldI = c.izrada || {status:'nije_pocelo', naplata:{naplaceno:false,iznos:'',valuta:'KM',datum:''}};
    const ponuda1 = {
      id: uid(), naziv:'Ponuda 1', firma:'',
      ponudaMaterijalIznos: sumArr(oldP.kroznaListaFirme,'iznos') || '',
      cijenaOkovaIznos: sumArr(oldP.okovFirme,'iznos') || '',
      ponudaPotvrdjena: !!oldP.ponudaPotvrdjena,
      ponudaIznos: oldP.ponudaIznos || '', ponudaDatum: oldP.ponudaDatum || '',
      dogovoreniIznos: oldP.dogovoreniIznos || '', avansi: oldP.avansi || []
    };
    c.poslovi = [{
      id: uid(), naziv:'Posao 1',
      okvirniDatumIzrade: oldP.okvirniDatumIzrade || '', rokDizajn: oldP.rokDizajn || '',
      dizajnPredat: !!oldP.dizajnPredat, dizajnPotvrdjen: !!oldP.dizajnPotvrdjen, dizajnFajl: oldP.dizajnFajl || null,
      ponude: [ponuda1], nabavka: oldN, izrada: oldI
    }];
    delete c.ponuda; delete c.nabavka; delete c.izrada;
  }
  c.poslovi.forEach(migratePosao);
}

/* ---------- Firestore load/save ----------
   Svaki kupac je poseban dokument (users/{uid}/customers/{kupacId}). */
function customersColRef(){ return db.collection('users').doc(currentUser.uid).collection('customers'); }
let knownCustomerIds = new Set();

async function loadData(){
  try{
    const snap = await customersColRef().get();
    state.customers = snap.docs.map(d=>d.data());
    knownCustomerIds = new Set(snap.docs.map(d=>d.id));
  }catch(e){
    console.error('Greška pri učitavanju podataka', e);
    state.customers = [];
  }
  state.customers.forEach(migrateCustomer);
  state.loaded = true;
  render();
}
function setSyncStatus(mode){
  const el = document.getElementById('sync-dot');
  if(!el) return;
  el.className = 'sync-dot' + (mode==='busy' ? ' busy' : mode==='err' ? ' err' : '');
}
function downloadBackupJSON(){
  const payload = { exportDatum: new Date().toISOString(), korisnik: currentUser?currentUser.email:'', customers: state.customers };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const datum = new Date().toISOString().slice(0,10);
  a.download = 'neva-design-rezervna-kopija-' + datum + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
async function persist(){
  // debounced upis u Firestore da se ne šalje zahtjev na svaki tast
  clearTimeout(saveTimer);
  setSyncStatus('busy');
  saveTimer = setTimeout(async ()=>{
    try{
      const batch = db.batch();
      const currentIds = new Set();
      state.customers.forEach(c=>{
        currentIds.add(c.id);
        batch.set(customersColRef().doc(c.id), c);
      });
      knownCustomerIds.forEach(id=>{ if(!currentIds.has(id)) batch.delete(customersColRef().doc(id)); });
      await batch.commit();
      knownCustomerIds = currentIds;
      setSyncStatus('ok');
    }catch(e){
      console.error('Greška pri čuvanju podataka', e);
      setSyncStatus('err');
      if(String(e.message||'').toLowerCase().includes('longer than')){
        alert('Ovaj kupac ima previše priloženih fajlova/slika da bi stao u besplatnu bazu (limit je oko 1MB po kupcu). Ukloni neki stariji fajl kod ovog kupca, ili smanji rezoluciju slika prije dodavanja.');
      }else{
        alert('Greška pri čuvanju podataka na internetu — provjeri internet konekciju. Izmjene ostaju samo lokalno dok se konekcija ne uspostavi.');
      }
    }
  }, 500);
}

/* ---------- files ---------- */
function readFileAsDataUrl(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
// Za slike: smanjuje rezoluciju i kompresuje, da bi stale u besplatnu bazu (limit ~1MB po kupcu).
// Za ostale fajlove (npr. PDF): vraća original, uz provjeru veličine.
async function fileToStoredDataUrl(file){
  if(!file.type || !file.type.startsWith('image/')){
    if(file.size > 700*1024){
      throw new Error('Fajl "'+file.name+'" je prevelik ('+Math.round(file.size/1024)+' KB). Za PDF/dokument fajlove, najveća dozvoljena veličina je oko 700 KB — smanji fajl (npr. skeniraj u nižoj rezoluciji ili sačuvaj kao "smaller file size" PDF) pa probaj ponovo.');
    }
    return await readFileAsDataUrl(file);
  }
  const rawUrl = await readFileAsDataUrl(file);
  const img = await new Promise((resolve,reject)=>{
    const im = new Image();
    im.onload = ()=>resolve(im);
    im.onerror = reject;
    im.src = rawUrl;
  });
  const MAX_DIM = 1600;
  let w = img.width, h = img.height;
  if(w > MAX_DIM || h > MAX_DIM){
    const scale = MAX_DIM / Math.max(w,h);
    w = Math.round(w*scale); h = Math.round(h*scale);
  }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(img, 0, 0, w, h);
  let quality = 0.82;
  let out = canvas.toDataURL('image/jpeg', quality);
  while(out.length > 700*1024 && quality > 0.35){
    quality -= 0.12;
    out = canvas.toDataURL('image/jpeg', quality);
  }
  if(out.length > 700*1024){
    throw new Error('Slika "'+file.name+'" je i nakon smanjenja prevelika. Probaj sa fotografijom manje rezolucije.');
  }
  return out;
}
async function handleNapomenaFileUpload(input, id, rowId){
  const file = input.files[0]; if(!file) return;
  let dataUrl; try{ dataUrl = await fileToStoredDataUrl(file); }catch(e){ alert(e.message); input.value=''; return; }
  setRowField(id, 'napomene', rowId, 'fajl', {name:file.name, dataUrl});
}

/* ---------- voice input ---------- */
function enhanceVoiceInputs(){
  const inputs = document.querySelectorAll('#app input[type="text"]:not([data-mic]):not([disabled]), #app input[type="number"]:not([data-mic]):not([disabled])');
  inputs.forEach(inp=>{
    inp.setAttribute('data-mic','1');
    const wrapper = document.createElement('div');
    wrapper.className = 'field-mic-row';
    inp.parentNode.insertBefore(wrapper, inp);
    wrapper.appendChild(inp);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'mic-btn';
    btn.title = 'Unos glasom';
    btn.textContent = '🎤';
    btn.onclick = ()=>startVoiceInput(inp, btn);
    wrapper.appendChild(btn);
  });
}
function startVoiceInput(inputEl, btnEl){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('Glasovni unos nije podržan u ovom pregledaču. Probajte u Google Chrome na Android telefonu.'); return; }
  const recognition = new SR();
  recognition.lang = 'hr-HR';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  btnEl.classList.add('listening');
  recognition.onresult = (e)=>{
    const text = e.results[0][0].transcript;
    if(inputEl.type==='number'){
      const cleaned = text.replace(',', '.').match(/-?[\d.]+/);
      inputEl.value = cleaned ? cleaned[0] : inputEl.value;
    }else{
      inputEl.value = inputEl.value ? (inputEl.value + ' ' + text) : text;
    }
    inputEl.dispatchEvent(new Event('change', {bubbles:true}));
  };
  recognition.onerror = ()=>{ btnEl.classList.remove('listening'); };
  recognition.onend = ()=>{ btnEl.classList.remove('listening'); };
  try{ recognition.start(); }catch(e){ btnEl.classList.remove('listening'); }
}

/* ---------- calendar reminders (.ics download) ---------- */
function icsNow(){ return new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z'; }
function icsEscape(s){ return String(s||'').replace(/([,;])/g,'\\$1').replace(/\n/g,'\\n'); }
function downloadICS(title, dateStr, description){
  if(!dateStr){ alert('Prvo unesite datum za ovo polje.'); return; }
  const dt = dateStr.replace(/-/g,'');
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//NeVa design//Radionica//BS','CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    'UID:'+uid()+'@neva-design',
    'DTSTAMP:'+icsNow(),
    'DTSTART;VALUE=DATE:'+dt,
    'DTEND;VALUE=DATE:'+dt,
    'SUMMARY:'+icsEscape(title),
    'DESCRIPTION:'+icsEscape(description||'NeVa design — podsjetnik'),
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Podsjetnik','TRIGGER:-P1D','END:VALARM',
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (title.replace(/[^a-zA-Z0-9čćžšđČĆŽŠĐ]+/g,'_') || 'podsjetnik') + '.ics';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}

/* ---------- list view ---------- */
function renderList(){
  let html = `
    <div class="add-bar">
      <input type="text" id="newCustName" placeholder="Ime i prezime kupca…" onkeydown="if(event.key==='Enter') submitNewCustomer()">
      <button class="btn btn-primary" onclick="submitNewCustomer()">+ Dodaj kupca</button>
    </div>`;
  if(state.customers.length===0){
    html += `<div class="empty"><div class="empty-title">Još nema kupaca</div>Dodajte prvog kupca da započnete vođenje posla.</div>`;
    return html;
  }
  html += state.customers.slice().reverse().map(c=>{
    const faza = fazaLabel(c);
    return `<div class="card cust-card" onclick="openCustomer('${c.id}')">
      <div>
        <div class="cust-name">${esc(c.naziv)}</div>
        <div class="cust-meta">${faza.text}</div>
        <div class="chip-row">
          ${chip(c.poslovi.some(p=>p.dizajnPotvrdjen),'Dizajn potvrđen')}
          ${chip(c.poslovi.some(p=>ponudaPotvrdjena(p)),'Ponuda potvrđena')}
          ${chip(c.poslovi.some(p=>num(p.ponuda.avansIznos)>0),'Avans dat')}
          ${chip(c.poslovi.some(p=>p.izrada.naplata.naplaceno),'Naplaćeno')}
        </div>
      </div>
    </div>`;
  }).join('');
  return html;
}
function chip(on,label){ return `<span class="chip ${on?'chip-on':'chip-off'}">${on?'✓':'○'} ${label}</span>`; }
function submitNewCustomer(){
  const inp = document.getElementById('newCustName');
  const val = inp.value.trim();
  addCustomer(val || 'Novi kupac');
}
function fazaLabel(c){
  if(!c.poslovi || c.poslovi.length===0) return {text:'Nema poslova'};
  let best = {text:'U fazi ponude', rank:0};
  c.poslovi.forEach(p=>{
    let rank=0, text='U fazi ponude';
    if(p.izrada.naplata.naplaceno){ rank=6; text='Posao naplaćen i završen'; }
    else if(p.izrada.status==='zavrseno'){ rank=5; text='Izrada završena — čeka se naplata'; }
    else if(p.izrada.status==='u_izradi'){ rank=4; text='U izradi / montaži'; }
    else if(ponudaPotvrdjena(p)){ rank=3; text='Ponuda potvrđena — priprema materijala'; }
    else if(ponudaPoslata(p)){ rank=2; text='Ponuda poslata kupcu — čeka se potvrda'; }
    else if(p.dizajnPotvrdjen){ rank=1; text='Dizajn potvrđen — priprema ponude'; }
    if(rank>best.rank) best = {text, rank};
  });
  const broj = c.poslovi.length;
  return {text: best.text + (broj>1 ? ` · ${broj} poslova` : '')};
}

  const stat = `<div class="stat-card"><div class="stat-label">Ukupan prihod (naplaćeno)</div><div class="stat-value">${money(ukupanPrihod())} KM</div></div>`;
  let rows = '';
  state.customers.slice().reverse().forEach(c=>{

      rows += `<div class="card pregled-card">
        <div class="cust-name" style="cursor:pointer;" onclick="openCustomer('${c.id}')">${esc(c.naziv)} — ${esc(p.naziv)}</div>

          ${chip(p.dizajnPredat,'Dizajn predat')}

          ${chip(ponudaPoslata(p),'Ponuda poslata')}

  return stat + `<h2 class="section-title">Pregled po poslovima</h2>` + rows;
}

/* ---------- Izvještaji (reports) ---------- */
function renderIzvestaji(){
  if(state.customers.length===0) return `<div class="empty"><div class="empty-title">Nema podataka</div>Izvještaji će se pojaviti kada unesete podatke o troškovima (materijal i ostali troškovi).</div>`;

  const firme = {}; const firmeNazivi = {};   // firma -> {materijal, ostali}
  function addFirma(naziv, polje, iznos){
    const t = (naziv||'').trim();
    const lk = t.toLowerCase();
    if(!firmeNazivi[lk]) firmeNazivi[lk] = t || '(bez firme)';
    const label = firmeNazivi[lk];
    if(!firme[label]) firme[label] = {materijal:0, ostali:0};
    firme[label][polje] += iznos;
  }
  const ostali = {}; const ostaliNazivi = {};
  let prevoz = 0, prevozBroj = 0;
  state.customers.forEach(c=>{
    c.poslovi.forEach(p=>{
      p.ponuda.materijal.forEach(r=>{ addFirma(r.firma, 'materijal', num(r.iznos)); });
      p.ponuda.ostaliTroskovi.forEach(r=>{
        const naziv = (r.naziv||'').trim();
        const iznos = num(r.iznos);
        addFirma(r.firma, 'ostali', iznos);
        if(JE_PREVOZ.test(naziv)){
          prevoz += iznos; prevozBroj++;
        }else{
          const lk = naziv.toLowerCase();
          if(!ostaliNazivi[lk]) ostaliNazivi[lk] = naziv || '(bez naziva)';
          const label = ostaliNazivi[lk];
          ostali[label] = (ostali[label]||0) + iznos;
        }
      });
    });
  });

  const stat = `<div class="stat-card"><div class="stat-label">Ukupan prihod (naplaćeno)</div><div class="stat-value">${money(ukupanPrihod())} KM</div></div>`;
  const podjela = ukupnoPoOsobi();
  const statOsobe = `<div class="row2" style="margin-bottom:22px;">
    <div class="stat-card"><div class="stat-label">Ukupno — Nešo</div><div class="stat-value">${money(podjela.neso)} KM</div></div>
    <div class="stat-card"><div class="stat-label">Ukupno — Vaso</div><div class="stat-value">${money(podjela.vaso)} KM</div></div>
  </div>`;

  const poMjesecima = prihodPoMjesecima();
  const mjesecKeys = Object.keys(poMjesecima).sort((a,b)=>{
    if(a==='(bez datuma)') return 1;
    if(b==='(bez datuma)') return -1;
    return b.localeCompare(a);
  });
  const mjesecniIzvjestaj = mjesecKeys.length===0 ? `<div class="note">Još nema naplaćenih poslova.</div>` :
    `<div class="card">` + mjesecKeys.map(key=>{
      const v = poMjesecima[key];
      const naziv = key==='(bez datuma)' ? 'Bez unesenog datuma naplate' : mjesecNaziv(key);
      return `<div class="summary-box" style="margin-bottom:10px;">
        <div class="sum-line"><span><b>${esc(naziv)}</b></span><b>${money(v.ukupno)} KM</b></div>
        <div class="sum-line"><span>Nešo</span><span>${money(v.neso)} KM</span></div>
        <div class="sum-line"><span>Vaso</span><span>${money(v.vaso)} KM</span></div>
      </div>`;
    }).join('') + `</div>`;

  const prevozCard = `<div class="stat-card amber"><div class="stat-label">Prevoz — ukupno</div><div class="stat-value">${money(prevoz)} KM</div><div class="stat-label" style="margin-top:6px;text-transform:none;">${prevozBroj===0 ? 'Još nema unesenih stavki prevoza' : prevozBroj+' stavk'+(prevozBroj===1?'a':'i')}</div></div>`;

  return stat + statOsobe + `
    <h2 class="section-title">Prihod po mjesecima</h2>
    ${mjesecniIzvjestaj}
    <div class="note" style="margin-bottom:22px;">Grupisano prema unesenom "Datumu naplate" u segmentu "Izrada i montaža". Podjela Nešo/Vaso računa se iz zarade posla (po skici) za naplaćene poslove.</div>

    <h2 class="section-title">Troškovi po firmama (materijal + ostali troškovi)</h2>
    ${renderFirmeList(firme)}
    <div class="note" style="margin-bottom:22px;">Zbir svih troškova upisanih uz firmu: "Troškovi → Materijal" i "Troškovi → Ostali troškovi" (polje Firma). Troškovi ostalih stavki bez upisane firme prikazani su pod „(bez firme)".</div>

    <h2 class="section-title">Utrošeno za ostale troškove</h2>
    ${prevozCard}
    ${renderBarList(ostali, 'amber')}
    <div class="note">Zasnovano na iznosima unesenim u "Troškovi → Ostali troškovi". Stavke čiji naziv sadrži „prevoz" ili „prijevoz" obračunavaju se posebno (iznad) i nisu uključene u ovu listu po vrstama troška (ali jesu u „Troškovi po firmama", ako je upisana firma).</div>
  `;
}
function renderFirmeList(firme){
  const entries = Object.entries(firme).map(([f,v])=>[f,v,v.materijal+v.ostali]).sort((a,b)=>b[2]-a[2]);
  if(entries.length===0) return `<div class="note">Još nema unesenih iznosa.</div>`;
  const max = Math.max(...entries.map(e=>e[2]), 1);
  const ukupno = entries.reduce((s,e)=>s+e[2],0);
  return `<div class="card">` + entries.map(([firma, v, tot])=>`
    <div class="rep-item">
      <div class="rep-label"><span>${esc(firma)}</span><span>${money(tot)} KM</span></div>
      <div class="rep-bar-bg"><div class="rep-bar" style="width:${Math.max(3,(tot/max*100))}%"></div></div>
      <div class="note" style="margin-top:3px;">Materijal: ${money(v.materijal)} KM · Ostali troškovi: ${money(v.ostali)} KM</div>
    </div>`).join('') + `<div class="sum-line sum-total" style="margin-top:6px;"><span>Ukupno</span><b>${money(ukupno)} KM</b></div></div>`;
}
function renderBarList(dataObj, barClass){
  const entries = Object.entries(dataObj).sort((a,b)=>b[1]-a[1]);
  if(entries.length===0) return `<div class="note">Još nema unesenih iznosa.</div>`;
  const max = Math.max(...entries.map(e=>e[1]), 1);
  return `<div class="card">` + entries.map(([firma, iznos])=>`
    <div class="rep-item">
      <div class="rep-label"><span>${esc(firma)}</span><span>${money(iznos)} KM</span></div>
      <div class="rep-bar-bg"><div class="rep-bar ${barClass}" style="width:${Math.max(3,(iznos/max*100))}%"></div></div>
    </div>`).join('') + `</div>`;
}

/* Prijava/odjava se obrađuje kroz auth.onAuthStateChanged (gore) —
   ono samo poziva loadData() kad je korisnik prijavljen. */
</script>
